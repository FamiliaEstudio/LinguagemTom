name: Tom 0.4

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: tom-lang/.nvmrc
      - name: LLVM 21.1.8 and desktop prerequisites
        shell: bash
        run: |
          node -e 'require("./scripts/setup-native").download(require("./scripts/toolchain.json").llvmAptInstaller)'
          sudo bash .tools/downloads/llvm-ci.sh 21
          sudo apt-get install -y llvm-21 build-essential xvfb xauth xclip
          clang-21 --version | head -1 | grep -F '21.1.8'
          opt-21 --version | grep -F '21.1.8'
          echo 'CLANG=clang-21' >> "$GITHUB_ENV"
          echo 'LLVM_OPT=opt-21' >> "$GITHUB_ENV"
      - name: Pinned native dependencies and runtime libraries
        run: node scripts/setup-native.js
      - name: Install editor test tools from lockfile
        run: npm ci --prefix tom-lang --ignore-scripts
      - name: LLVM, CLI, decimal, editor and SDL regression tests
        run: npm --prefix tom-lang test
      - name: Scriptorium foundations, standalone packages and 10000-document corpus
        run: node scripts/verify-scriptorium.js
      - uses: actions/upload-artifact@v4
        with:
          name: scriptorium-foundations-linux-x64
          include-hidden-files: true
          path: .tools/linux/validation-scriptorium/
      - name: Scriptorium application, import, versions, backup and package
        run: |
          npm --prefix tom-lang run test:scriptorium-app
          npm --prefix tom-lang run verify:scriptorium-app
          xvfb-run -a node aplicativos/scriptorium/scripts/verify-desktop.js
      - uses: actions/upload-artifact@v4
        with:
          name: scriptorium-linux-x64
          include-hidden-files: true
          path: .tools/linux/scriptorium/
      - name: Reusable editor, recovery, clipboard and standalone packages
        run: |
          xvfb-run -a node scripts/verify-editor.js --desktop
          xvfb-run -a node scripts/verify-editor-clipboard.js
      - uses: actions/upload-artifact@v4
        with:
          name: scriptorium-editor-linux-x64
          include-hidden-files: true
          path: .tools/linux/validation-editor/
      - name: C and Tom calculator benchmark correctness (O0 and O2)
        run: npm --prefix tom-lang run benchmark:verify
      - name: Tom Companion course, protocol and native integration
        run: npm --prefix tom-lang run test:companion
      - name: Tom Companion desktop and package
        run: |
          xvfb-run -a node aplicativos/tom-companion/scripts/verify-desktop.js
          xvfb-run -a node aplicativos/tom-companion/scripts/verify-desktop.js --package
          xvfb-run -a node aplicativos/tom-companion/scripts/verify-map-desktop.js
          xvfb-run -a node aplicativos/tom-companion/scripts/verify-map-desktop.js --package
          node aplicativos/tom-companion/scripts/benchmark-map.js
          node aplicativos/tom-companion/scripts/package.js
      - uses: actions/upload-artifact@v4
        with:
          name: tom-companion-linux-x64
          path: aplicativos/tom-companion/build/packages/
      - name: Musical demonstrations with simulated devices (O0 and O2)
        run: node scripts/verify-multimedia.js
      - name: State, input, JSON and replay demonstrations (O0 and O2)
        run: node scripts/verify-state.js
      - name: Musical Tom game, persistence and deterministic sessions
        run: node --test --test-concurrency=1 jogos/musical-tom/tests/*.test.js
      - name: Musical Tom desktop and standalone package
        run: |
          xvfb-run -a env TOM_VERIFY_AUDIO_DRIVER=dummy node jogos/musical-tom/scripts/verify-desktop.js
          xvfb-run -a env TOM_VERIFY_AUDIO_DRIVER=dummy node jogos/musical-tom/scripts/verify-desktop.js --package
      - uses: actions/upload-artifact@v4
        with:
          name: musical-tom-linux-x64
          path: jogos/musical-tom/build/linux/package/musical-tom/
      - name: State laboratory on X11 and production packages
        run: |
          xvfb-run -a env TOM_VERIFY_AUDIO_DRIVER=dummy node scripts/verify-state.js --desktop
          xvfb-run -a env TOM_VERIFY_AUDIO_DRIVER=dummy node scripts/verify-state.js --package
      - name: X11 window with targeted native input
        run: xvfb-run -a node scripts/verify-desktop.js
      - name: Package Linux calculator
        run: xvfb-run -a node scripts/verify-desktop.js --package
      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-linux-x64-gnu
          path: tom-lang/exemplos/build/linux-x64-gnu/calculadora/
      - uses: actions/upload-artifact@v4
        with:
          name: laboratorio-linux-x64-gnu
          include-hidden-files: true
          path: .tools/linux/validation-04/packages/laboratorio/


  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install portable tools and runtime libraries
        shell: pwsh
        run: ./scripts/setup-windows.ps1
      - name: Install editor test tools from lockfile
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          npm.cmd ci --prefix tom-lang --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: LLVM, CLI, decimal, editor and SDL regression tests
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          npm.cmd --prefix tom-lang test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scriptorium application, import, versions, backup and package
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          npm.cmd --prefix tom-lang run test:scriptorium-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd --prefix tom-lang run verify:scriptorium-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node aplicativos/scriptorium/scripts/verify-desktop.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: scriptorium-windows-x64
          include-hidden-files: true
          path: .tools/windows/scriptorium/
      - name: Reusable editor, recovery, clipboard and standalone packages
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          node scripts/verify-editor.js --desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-editor-clipboard.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: scriptorium-editor-windows-x64
          include-hidden-files: true
          path: .tools/windows/validation-editor/
      - name: C and Tom calculator benchmark correctness (O0 and O2)
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          npm.cmd --prefix tom-lang run benchmark:verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scriptorium foundations, standalone packages and 10000-document corpus
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          node scripts/verify-scriptorium.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: scriptorium-foundations-windows-x64
          include-hidden-files: true
          path: .tools/windows/validation-scriptorium/
      - name: Musical demonstrations with simulated devices (O0 and O2)
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          node scripts/verify-multimedia.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tom Companion course, protocol and native integration
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          npm.cmd --prefix tom-lang run test:companion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node aplicativos/tom-companion/scripts/verify-desktop.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node aplicativos/tom-companion/scripts/verify-desktop.js --package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node aplicativos/tom-companion/scripts/verify-map-desktop.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node aplicativos/tom-companion/scripts/verify-map-desktop.js --package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node aplicativos/tom-companion/scripts/benchmark-map.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node aplicativos/tom-companion/scripts/package.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: tom-companion-windows-x64
          path: aplicativos/tom-companion/build/packages/
      - name: State, input, JSON and replay demonstrations (O0 and O2)
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          node scripts/verify-state.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Musical Tom game, persistence and deterministic sessions
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          node --test --test-concurrency=1 jogos/musical-tom/tests/*.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Musical Tom desktop and standalone package
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          $env:TOM_VERIFY_AUDIO_DRIVER = 'dummy'
          node jogos/musical-tom/scripts/verify-desktop.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node jogos/musical-tom/scripts/verify-desktop.js --package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: musical-tom-windows-x64
          path: jogos/musical-tom/build/windows/package/musical-tom/
      - name: State laboratory on Win32 and production packages
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          $env:TOM_VERIFY_AUDIO_DRIVER = 'dummy'
          node scripts/verify-state.js --desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-state.js --package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Win32 window with targeted native input
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          node scripts/verify-desktop.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows calculator
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          node scripts/verify-desktop.js --package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-windows-x64-mingw
          path: tom-lang/exemplos/build/windows-x64-mingw/calculadora/

      - uses: actions/upload-artifact@v4
        with:
          name: laboratorio-windows-x64-mingw
          include-hidden-files: true
          path: .tools/windows/validation-04/packages/laboratorio/
